dependencies {
    implementation 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}
tasks.test { useJUnitPlatform() }

def buildInfoDirectory = layout.buildDirectory.dir('generated/sources/buildInfo/java')
def generateBuildInfo = tasks.register('generateBuildInfo') {
    inputs.property('version', project.version.toString())
    outputs.dir(buildInfoDirectory)
    doLast {
        def source = buildInfoDirectory.get().file('inceris/rcc/common/BuildInfo.java').asFile
        source.parentFile.mkdirs()
        def versionLiteral = project.version.toString().replace('\\', '\\\\').replace('"', '\\"')
        source.text = """package inceris.rcc.common;

public final class BuildInfo {
    public static final String VERSION = "${versionLiteral}";
    public static final String LOAD_MESSAGE = "Remote Custom Commands " + VERSION + " by Inceris";
    private BuildInfo() {}
}
"""
    }
}
sourceSets.main.java.srcDir(buildInfoDirectory)
tasks.compileJava { dependsOn generateBuildInfo }
